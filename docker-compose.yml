services:
  client:
    build: ./client
    ports:
      - "8080:8080"
    depends_on:
      - server
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/app
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      - mongo
  mongo:
    image: mongo
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
